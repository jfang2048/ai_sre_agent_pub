# Container-default collector configuration (v0.6)
---
collector_id: ""
hostname: ""
version: "v0.6"
labels: {}

controller_endpoints:
  # Compose default. Override on remote collector hosts to point at the central
  # controller's reachable gRPC address.
  - "controller:9090"

collection_interval: "10s"
adaptive_polling: true
min_collection_interval: "2s"
max_collection_interval: "30s"
topk: 10

spool_dir: "/var/lib/ai-sre-agent/collector/data/spool"
spool_max_bytes: 134217728

log_paths: []

shm_enabled: false
shm_name: "/sre_collector_metrics"

grpc_compress: true
mirror_send: false
metrics_listen_address: ":9464"
tracing_jaeger_endpoint: ""
level: 5

transport:
  dial_timeout: "10s"
  rpc_timeout: "10s"
  tls:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    server_name: ""
    insecure_skip_verify: false
    reload_interval: "30s"

ebpf:
  enabled: true
  socket_path: "/var/lib/ai-sre-agent/collector/data/run/sre_collector_ebpf.sock"
  categories: ["syscall", "process", "network", "file", "security", "resource"]
  max_msg_bytes: 65536
  ring_size: 2048
  event_flush_limit: 256
  allowed_listen_ports: [22, 53, 80, 443, 2379, 2380, 3000, 5432, 6443, 8080, 8443, 9090]
  synthetic_poll_interval: "10s"
  long_lived_tcp_threshold: "5m"

probe_core:
  enabled: true
  binary_path: "/usr/local/bin/sre-probe-core"
  collectors: []
  args: ["--host-mode", "auto"]
  compression: "none"
  queue_depth: 16
  window_samples: 6
  gpu_interval_samples: 5
  startup_timeout: "3s"
  stale_after: "15s"
  frame_max_bytes: 8388608
  # Compatibility fallback only; host-observer deployments should keep probe-core healthy.
  fallback_to_go: true

security:
  enabled: true
  audit_interval: "5m"
  recent_event_limit: 128
  baseline_warmup_samples: 3
  max_walk_entries: 6000
  large_file_threshold_bytes: 104857600
  rapid_growth_threshold_bytes: 16777216

external_metrics_cmd: ""
external_metrics_timeout: "500ms"
