apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-openai
  namespace: ai-serving
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: gpu-platform-sre-demo
    sre-agent.io/workload-kind: model-serving
    sre-agent.io/model-runtime: vllm
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      sre-agent.io/model-runtime: vllm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: gpu-platform-sre-demo
        sre-agent.io/workload-kind: model-serving
        sre-agent.io/model-runtime: vllm
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --model
            - $(MODEL_ID)
            - --served-model-name
            - gpu-platform-demo
          env:
            - name: MODEL_ID
              value: facebook/opt-125m
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-model-access
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
