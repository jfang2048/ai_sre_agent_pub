services:
  controller:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: controller
    image: sre-controller:latest
    container_name: sre-controller
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./configs/controller.yaml:/etc/sre-controller/config.yaml:ro
      - ./web:/var/lib/sre-controller/web:ro
      - sre-controller-data:/var/lib/sre-controller/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  collector:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: collector
    image: sre-collector:latest
    container_name: sre-collector
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
    environment:
      - SRE_COLLECTOR_CONTROLLER_ENDPOINTS=controller:9090
      - SRE_COLLECTOR_SPOOL_DIR=/var/lib/sre-collector/spool
      - SRE_COLLECTOR_CONFIG=/etc/sre-collector/config.yaml
    volumes:
      - sre-collector-data:/var/lib/sre-collector
      - ./configs/collector.yaml:/etc/sre-collector/config.yaml:ro

volumes:
  sre-collector-data:
  sre-controller-data:
