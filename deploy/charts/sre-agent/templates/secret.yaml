{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-agent.fullname" . }}-secrets
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.api_key }}
  api-key: {{ .Values.secrets.api_key | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.webhook_url }}
  webhook-url: {{ .Values.secrets.webhook_url | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.slack_webhook_url }}
  slack-webhook-url: {{ .Values.secrets.slack_webhook_url | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.pagerduty_routing_key }}
  pagerduty-routing-key: {{ .Values.secrets.pagerduty_routing_key | b64enc | quote }}
  {{- end }}
{{- end -}}
