{{- if and .Values.controller.enabled .Values.controller.rag.vectorToken (not .Values.controller.rag.vectorTokenSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-agent.controllerRagVectorSecretName" . }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
    {{- include "sre-agent.controllerSelectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.controller.rag.vectorTokenSecretKey }}: {{ .Values.controller.rag.vectorToken | quote }}
{{- end }}
