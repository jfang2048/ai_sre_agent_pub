apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-agent.fullname" . }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort | default 8080 }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort | default 9090 }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "sre-agent.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-agent.fullname" . }}-metrics
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort | default 9090 }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "sre-agent.selectorLabels" . | nindent 4 }}
