{{- if and .Values.controller.enabled .Values.controller.ha.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sre-agent.controllerName" . }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
    {{- include "sre-agent.controllerSelectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "sre-agent.controllerPeerServiceName" . }}
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "sre-agent.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sre-agent.controllerSelectorLabels" . | nindent 8 }}
        {{- include "sre-agent.labels" . | nindent 8 }}
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sre-agent.controllerServiceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SRE_CONTROLLER_CONFIG
              value: /etc/ai-sre-agent/controller.yaml
            - name: SRE_CONTROLLER_HTTP_LISTEN
              value: 0.0.0.0:{{ .Values.controller.service.httpPort }}
            - name: SRE_CONTROLLER_GRPC_LISTEN
              value: 0.0.0.0:{{ .Values.controller.service.grpcPort }}
            - name: SRE_CONTROLLER_WEB_PATH
              value: /var/lib/ai-sre-agent/controller/web
            - name: SRE_CONTROLLER_HA_ENABLED
              value: "1"
            - name: SRE_CONTROLLER_HA_BACKEND
              value: {{ .Values.controller.ha.backend | quote }}
            - name: SRE_CONTROLLER_HA_NODE_ID
              value: $(POD_NAME)
            - name: SRE_CONTROLLER_HA_ADVERTISE_HTTP
              value: "http://$(POD_NAME).{{ include \"sre-agent.controllerPeerServiceName\" . }}.{{ include \"sre-agent.namespace\" . }}.svc.cluster.local:{{ .Values.controller.service.httpPort }}"
            - name: SRE_CONTROLLER_HA_ADVERTISE_GRPC
              value: "$(POD_NAME).{{ include \"sre-agent.controllerPeerServiceName\" . }}.{{ include \"sre-agent.namespace\" . }}.svc.cluster.local:{{ .Values.controller.service.grpcPort }}"
            - name: SRE_CONTROLLER_HA_ELECTION_KEY
              value: {{ .Values.controller.ha.electionKey | quote }}
            - name: SRE_CONTROLLER_HA_LEASE_TTL
              value: {{ .Values.controller.ha.leaseTTL | quote }}
            - name: SRE_CONTROLLER_HA_OBSERVE_INTERVAL
              value: {{ .Values.controller.ha.observeInterval | quote }}
            - name: SRE_CONTROLLER_HA_CAMPAIGN_TIMEOUT
              value: {{ .Values.controller.ha.campaignTimeout | quote }}
            - name: SRE_CONTROLLER_HA_ALLOW_FOLLOWER_READ
              value: {{ .Values.controller.ha.allowFollowerRead | quote }}
            {{- if .Values.controller.ha.etcdEndpoints }}
            - name: SRE_CONTROLLER_HA_ETCD_ENDPOINTS
              value: {{ join "," .Values.controller.ha.etcdEndpoints | quote }}
            {{- end }}
            - name: SRE_INGEST_PERSIST_ENABLED
              value: {{ .Values.controller.env.ingestPersistEnabled | quote }}
            - name: SRE_AGENT_RAG_ENABLED
              value: {{ .Values.controller.env.ragEnabled | quote }}
            - name: SRE_AGENT_RAG_REBUILD_POLICY
              value: {{ .Values.controller.env.ragRebuildPolicy | quote }}
            - name: SRE_AGENT_LLM_ENABLED
              value: {{ .Values.controller.env.llmEnabled | quote }}
            - name: SRE_AGENT_DRY_RUN
              value: {{ .Values.controller.env.dryRun | quote }}
            - name: SRE_TSDB_ENABLED
              value: {{ .Values.controller.env.tsdbEnabled | quote }}
            - name: SRE_TSDB_PROVIDER
              value: {{ .Values.controller.env.tsdbProvider | quote }}
            - name: SRE_TSDB_URL
              value: {{ .Values.controller.env.tsdbURL | quote }}
            - name: SRE_TSDB_ORG
              value: {{ .Values.controller.env.tsdbOrg | quote }}
            - name: SRE_TSDB_BUCKET
              value: {{ .Values.controller.env.tsdbBucket | quote }}
            - name: SRE_TSDB_RETENTION
              value: {{ .Values.controller.env.tsdbRetention | quote }}
            - name: SRE_TSDB_FALLBACK_TO_MEMORY
              value: {{ .Values.controller.env.tsdbFallbackToMemory | quote }}
            - name: SRE_TSDB_MANAGE_BUCKET
              value: {{ .Values.controller.env.tsdbManageBucket | quote }}
            {{- range .Values.controller.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.controller.extraEnvFromSecrets }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: {{ default true .optional }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.controller.service.grpcPort }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          volumeMounts:
            - name: controller-data
              mountPath: /var/lib/ai-sre-agent/controller/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne .Values.controller.dataVolume.type "pvc" }}
      volumes:
        - name: controller-data
          emptyDir: {}
      {{- end }}
  {{- if eq .Values.controller.dataVolume.type "pvc" }}
  volumeClaimTemplates:
    - metadata:
        name: controller-data
        labels:
          {{- include "sre-agent.labels" . | nindent 10 }}
          {{- include "sre-agent.controllerSelectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.controller.dataVolume.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.controller.dataVolume.size }}
        {{- with .Values.controller.dataVolume.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
