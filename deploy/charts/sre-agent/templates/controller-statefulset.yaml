{{- if and .Values.controller.enabled .Values.controller.ha.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sre-agent.controllerName" . }}
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
    {{- include "sre-agent.controllerSelectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "sre-agent.controllerPeerServiceName" . }}
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "sre-agent.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sre-agent.controllerSelectorLabels" . | nindent 8 }}
        {{- include "sre-agent.labels" . | nindent 8 }}
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sre-agent.controllerServiceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ default .Chart.AppVersion .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SRE_CONTROLLER_CONFIG
              value: /etc/ai-sre-agent/controller.yaml
            - name: SRE_CONTROLLER_HTTP_LISTEN
              value: 0.0.0.0:{{ .Values.controller.service.httpPort }}
            - name: SRE_CONTROLLER_GRPC_LISTEN
              value: 0.0.0.0:{{ .Values.controller.service.grpcPort }}
            - name: SRE_CONTROLLER_WEB_PATH
              value: /var/lib/ai-sre-agent/controller/web
            - name: SRE_AGENT_WORKFLOW_STORE_BACKEND
              value: {{ .Values.controller.workflowStore.backend | quote }}
            {{- if eq .Values.controller.workflowStore.backend "postgres" }}
            - name: SRE_AGENT_WORKFLOW_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.workflowStore.postgres.dsnSecretName }}
                  key: {{ .Values.controller.workflowStore.postgres.dsnSecretKey | quote }}
            {{- end }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_METADATA_BACKEND
              value: {{ .Values.controller.artifacts.metadataBackend | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_METADATA_PATH
              value: {{ .Values.controller.artifacts.metadataPath | quote }}
            {{- if eq .Values.controller.artifacts.metadataBackend "postgres" }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.artifacts.postgres.dsnSecretName }}
                  key: {{ .Values.controller.artifacts.postgres.dsnSecretKey | quote }}
            {{- end }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_PAYLOAD_BACKEND
              value: {{ .Values.controller.artifacts.payloadBackend | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_PAYLOAD_ROOT_PATH
              value: {{ .Values.controller.artifacts.payloadRootPath | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_PAYLOAD_SHARED
              value: {{ .Values.controller.artifacts.payloadShared | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_GC_ENABLED
              value: {{ .Values.controller.artifacts.gc.enabled | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_GC_INTERVAL
              value: {{ .Values.controller.artifacts.gc.interval | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_GC_BATCH_SIZE
              value: {{ .Values.controller.artifacts.gc.batchSize | quote }}
            {{- if eq .Values.controller.artifacts.payloadBackend "s3" }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_ENDPOINT
              value: {{ .Values.controller.artifacts.s3.endpoint | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_REGION
              value: {{ .Values.controller.artifacts.s3.region | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_BUCKET
              value: {{ .Values.controller.artifacts.s3.bucket | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_PREFIX
              value: {{ .Values.controller.artifacts.s3.prefix | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_PATH_STYLE
              value: {{ .Values.controller.artifacts.s3.pathStyle | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_INSECURE
              value: {{ .Values.controller.artifacts.s3.insecure | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.artifacts.s3.accessKeySecretName }}
                  key: {{ .Values.controller.artifacts.s3.accessKeySecretKey | quote }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.artifacts.s3.secretKeySecretName }}
                  key: {{ .Values.controller.artifacts.s3.secretKeySecretKey | quote }}
            {{- if .Values.controller.artifacts.s3.sessionTokenSecretName }}
            - name: SRE_AGENT_WORKFLOW_ARTIFACT_S3_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.artifacts.s3.sessionTokenSecretName }}
                  key: {{ .Values.controller.artifacts.s3.sessionTokenSecretKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.controller.auth.enabled }}
            - name: SRE_AGENT_CONTROLLER_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.auth.tokenSecretName }}
                  key: {{ .Values.controller.auth.tokenSecretKey | quote }}
            {{- end }}
            {{- if .Values.controller.auth.apiKeySecretName }}
            - name: SRE_AGENT_CONTROLLER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.auth.apiKeySecretName }}
                  key: {{ .Values.controller.auth.apiKeySecretKey | quote }}
            {{- end }}
            {{- if .Values.controller.auth.readAPIKeySecretName }}
            - name: SRE_AGENT_CONTROLLER_READ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.auth.readAPIKeySecretName }}
                  key: {{ .Values.controller.auth.readAPIKeySecretKey | quote }}
            {{- end }}
            {{- if .Values.controller.auth.actionAPIKeySecretName }}
            - name: SRE_AGENT_CONTROLLER_ACTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.auth.actionAPIKeySecretName }}
                  key: {{ .Values.controller.auth.actionAPIKeySecretKey | quote }}
            {{- end }}
            - name: SRE_CONTROLLER_HA_ENABLED
              value: "1"
            - name: SRE_CONTROLLER_HA_BACKEND
              value: {{ .Values.controller.ha.backend | quote }}
            - name: SRE_CONTROLLER_HA_NODE_ID
              value: $(POD_NAME)
            - name: SRE_CONTROLLER_HA_ADVERTISE_HTTP
              value: "http://$(POD_NAME).{{ include "sre-agent.controllerPeerServiceName" . }}.{{ include "sre-agent.namespace" . }}.svc.cluster.local:{{ .Values.controller.service.httpPort }}"
            - name: SRE_CONTROLLER_HA_ADVERTISE_GRPC
              value: "$(POD_NAME).{{ include "sre-agent.controllerPeerServiceName" . }}.{{ include "sre-agent.namespace" . }}.svc.cluster.local:{{ .Values.controller.service.grpcPort }}"
            - name: SRE_CONTROLLER_HA_ELECTION_KEY
              value: {{ .Values.controller.ha.electionKey | quote }}
            - name: SRE_CONTROLLER_HA_LEASE_TTL
              value: {{ .Values.controller.ha.leaseTTL | quote }}
            - name: SRE_CONTROLLER_HA_OBSERVE_INTERVAL
              value: {{ .Values.controller.ha.observeInterval | quote }}
            - name: SRE_CONTROLLER_HA_CAMPAIGN_TIMEOUT
              value: {{ .Values.controller.ha.campaignTimeout | quote }}
            - name: SRE_CONTROLLER_HA_ALLOW_FOLLOWER_READ
              value: {{ .Values.controller.ha.allowFollowerRead | quote }}
            {{- if .Values.controller.ha.etcdEndpoints }}
            - name: SRE_CONTROLLER_HA_ETCD_ENDPOINTS
              value: {{ join "," .Values.controller.ha.etcdEndpoints | quote }}
            {{- end }}
            - name: SRE_INGEST_PERSIST_ENABLED
              value: {{ .Values.controller.env.ingestPersistEnabled | quote }}
            - name: SRE_AGENT_RAG_ENABLED
              value: {{ .Values.controller.env.ragEnabled | quote }}
            - name: SRE_AGENT_RAG_REBUILD_POLICY
              value: {{ .Values.controller.env.ragRebuildPolicy | quote }}
            {{- if or .Values.controller.rag.vectorToken .Values.controller.rag.vectorTokenSecretName }}
            - name: SRE_AGENT_RAG_VECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.controllerRagVectorSecretName" . }}
                  key: {{ .Values.controller.rag.vectorTokenSecretKey | quote }}
            {{- end }}
            - name: SRE_AGENT_LLM_ENABLED
              value: {{ .Values.controller.env.llmEnabled | quote }}
            - name: SRE_AGENT_DRY_RUN
              value: {{ .Values.controller.env.dryRun | quote }}
            - name: SRE_TSDB_ENABLED
              value: {{ .Values.controller.env.tsdbEnabled | quote }}
            - name: SRE_TSDB_PROVIDER
              value: {{ .Values.controller.env.tsdbProvider | quote }}
            - name: SRE_TSDB_URL
              value: {{ .Values.controller.env.tsdbURL | quote }}
            - name: SRE_TSDB_ORG
              value: {{ .Values.controller.env.tsdbOrg | quote }}
            - name: SRE_TSDB_BUCKET
              value: {{ .Values.controller.env.tsdbBucket | quote }}
            - name: SRE_TSDB_RETENTION
              value: {{ .Values.controller.env.tsdbRetention | quote }}
            - name: SRE_TSDB_FALLBACK_TO_MEMORY
              value: {{ .Values.controller.env.tsdbFallbackToMemory | quote }}
            - name: SRE_TSDB_MANAGE_BUCKET
              value: {{ .Values.controller.env.tsdbManageBucket | quote }}
            {{- range .Values.controller.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.controller.extraEnvFromSecrets }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: {{ default true .optional }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.controller.service.grpcPort }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          volumeMounts:
            - name: controller-config
              mountPath: /etc/ai-sre-agent/controller.yaml
              subPath: controller.yaml
              readOnly: true
            - name: controller-targets
              mountPath: /etc/ai-sre-agent/controller_targets.yaml
              subPath: controller_targets.yaml
              readOnly: true
            - name: controller-data
              mountPath: /var/lib/ai-sre-agent/controller/data
            {{- if .Values.controller.ingestTransport.tls.enabled }}
            - name: controller-ingest-server-tls
              mountPath: /etc/ai-sre-agent/tls/ingest/server
              readOnly: true
            {{- end }}
            {{- if and .Values.controller.ingestTransport.tls.enabled .Values.controller.ingestTransport.tls.requireClientCert }}
            - name: controller-ingest-client-ca
              mountPath: /etc/ai-sre-agent/tls/ingest/ca
              readOnly: true
            {{- end }}
          {{- if .Values.controller.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.controller.startupProbe.path | quote }}
              port: http
            periodSeconds: {{ .Values.controller.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.controller.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.controller.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $controllerAffinity := include "sre-agent.controllerAffinity" . | trim }}
      {{- if $controllerAffinity }}
      affinity:
{{ $controllerAffinity | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne .Values.controller.dataVolume.type "pvc" }}
      volumes:
        - name: controller-config
          configMap:
            name: {{ include "sre-agent.controllerName" . }}-config
            items:
              - key: controller.yaml
                path: controller.yaml
        - name: controller-targets
          configMap:
            name: {{ include "sre-agent.controllerName" . }}-config
            items:
              - key: controller_targets.yaml
                path: controller_targets.yaml
        - name: controller-data
          emptyDir: {}
        {{- if .Values.controller.ingestTransport.tls.enabled }}
        - name: controller-ingest-server-tls
          secret:
            secretName: {{ .Values.controller.ingestTransport.tls.certSecretName }}
            items:
              - key: {{ .Values.controller.ingestTransport.tls.certSecretKey | quote }}
                path: tls.crt
              - key: {{ .Values.controller.ingestTransport.tls.keySecretKey | quote }}
                path: tls.key
        {{- end }}
        {{- if and .Values.controller.ingestTransport.tls.enabled .Values.controller.ingestTransport.tls.requireClientCert }}
        - name: controller-ingest-client-ca
          secret:
            secretName: {{ .Values.controller.ingestTransport.tls.caSecretName }}
            items:
              - key: {{ .Values.controller.ingestTransport.tls.caSecretKey | quote }}
                path: ca.crt
        {{- end }}
      {{- end }}
      {{- if eq .Values.controller.dataVolume.type "pvc" }}
      volumes:
        - name: controller-config
          configMap:
            name: {{ include "sre-agent.controllerName" . }}-config
            items:
              - key: controller.yaml
                path: controller.yaml
        - name: controller-targets
          configMap:
            name: {{ include "sre-agent.controllerName" . }}-config
            items:
              - key: controller_targets.yaml
                path: controller_targets.yaml
        {{- if .Values.controller.ingestTransport.tls.enabled }}
        - name: controller-ingest-server-tls
          secret:
            secretName: {{ .Values.controller.ingestTransport.tls.certSecretName }}
            items:
              - key: {{ .Values.controller.ingestTransport.tls.certSecretKey | quote }}
                path: tls.crt
              - key: {{ .Values.controller.ingestTransport.tls.keySecretKey | quote }}
                path: tls.key
        {{- end }}
        {{- if and .Values.controller.ingestTransport.tls.enabled .Values.controller.ingestTransport.tls.requireClientCert }}
        - name: controller-ingest-client-ca
          secret:
            secretName: {{ .Values.controller.ingestTransport.tls.caSecretName }}
            items:
              - key: {{ .Values.controller.ingestTransport.tls.caSecretKey | quote }}
                path: ca.crt
        {{- end }}
      {{- end }}
  {{- if eq .Values.controller.dataVolume.type "pvc" }}
  volumeClaimTemplates:
    - metadata:
        name: controller-data
        labels:
          {{- include "sre-agent.labels" . | nindent 10 }}
          {{- include "sre-agent.controllerSelectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.controller.dataVolume.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.controller.dataVolume.size }}
        {{- with .Values.controller.dataVolume.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
