{{- if and .Values.controller.enabled (eq .Values.controller.dataVolume.type "pvc") (not .Values.controller.ha.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sre-agent.controllerName" . }}-data
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
    {{- include "sre-agent.controllerSelectorLabels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.controller.dataVolume.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.controller.dataVolume.size }}
  {{- with .Values.controller.dataVolume.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
