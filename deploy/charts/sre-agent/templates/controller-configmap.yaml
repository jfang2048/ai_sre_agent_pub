{{- if and .Values.controller.enabled .Values.controller.auth.enabled (not .Values.controller.auth.tokenSecretName) }}
{{- fail "controller.auth.enabled requires controller.auth.tokenSecretName" }}
{{- end }}
{{- if and .Values.controller.enabled (eq .Values.controller.workflowStore.backend "postgres") (not .Values.controller.workflowStore.postgres.dsnSecretName) }}
{{- fail "controller.workflowStore.backend=postgres requires controller.workflowStore.postgres.dsnSecretName" }}
{{- end }}
{{- if and .Values.controller.enabled .Values.controller.ingestTransport.tls.enabled (not .Values.controller.ingestTransport.tls.certSecretName) }}
{{- fail "controller.ingestTransport.tls.enabled requires controller.ingestTransport.tls.certSecretName" }}
{{- end }}
{{- if and .Values.controller.enabled .Values.controller.ingestTransport.tls.enabled .Values.controller.ingestTransport.tls.requireClientCert (not .Values.controller.ingestTransport.tls.caSecretName) }}
{{- fail "controller.ingestTransport.tls.requireClientCert=true requires controller.ingestTransport.tls.caSecretName" }}
{{- end }}
{{- if and .Values.controller.enabled .Values.collector.enabled .Values.controller.auth.enabled .Values.controller.auth.ingestAuthEnabled (not .Values.collector.transportAuth.enabled) }}
{{- fail "collector.transportAuth.enabled must stay true when the chart deploys collectors against controller ingest auth" }}
{{- end }}
{{- if and .Values.controller.enabled .Values.controller.auth.enabled .Values.controller.auth.ingestAuthEnabled .Values.collector.enabled .Values.collector.transportAuth.enabled (not .Values.collector.transportAuth.tokenSecretName) }}
{{- fail "collector.transportAuth.tokenSecretName is required when controller.auth.ingestAuthEnabled is true" }}
{{- end }}
{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-agent.controllerName" . }}-config
  namespace: {{ include "sre-agent.namespace" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
    {{- include "sre-agent.controllerSelectorLabels" . | nindent 4 }}
data:
  controller.yaml: |
    listen: "0.0.0.0:{{ .Values.controller.service.httpPort }}"
    grpc_listen: "0.0.0.0:{{ .Values.controller.service.grpcPort }}"
    log_level: "info"
    deployment:
      mode: {{ include "sre-agent.controllerDeploymentMode" . | quote }}
      cluster_name: {{ include "sre-agent.clusterName" . | quote }}
      data_root: {{ include "sre-agent.controllerDataRoot" . | quote }}
      external_url: {{ .Values.controller.externalURL | quote }}
      insecure_override: {{ .Values.controller.deployment.insecureOverride }}
    api:
      rate_limit_enabled: {{ .Values.controller.api.rateLimitEnabled }}
      rate_limit_rps: {{ .Values.controller.api.rateLimitRPS }}
      rate_limit_burst: {{ .Values.controller.api.rateLimitBurst }}
      action_rate_limit_enabled: {{ .Values.controller.api.actionRateLimitEnabled }}
      action_rate_limit_rps: {{ .Values.controller.api.actionRateLimitRPS }}
      action_rate_limit_burst: {{ .Values.controller.api.actionRateLimitBurst }}
      audit_mutations: {{ .Values.controller.api.auditMutations }}
      allowed_origins: {{ toJson .Values.controller.api.allowedOrigins }}
    auth:
      enabled: {{ .Values.controller.auth.enabled }}
      mode: {{ .Values.controller.auth.mode | quote }}
      allow_insecure_disable: {{ .Values.controller.auth.allowInsecureDisable }}
      token_secret_env: "SRE_AGENT_CONTROLLER_TOKEN_SECRET"
      token_issuer: {{ .Values.controller.auth.tokenIssuer | quote }}
      token_audience: {{ .Values.controller.auth.tokenAudience | quote }}
      ingest_auth_enabled: {{ .Values.controller.auth.ingestAuthEnabled }}
      ingest_token_audience: {{ .Values.controller.auth.ingestTokenAudience | quote }}
{{- if .Values.controller.auth.apiKeySecretName }}
      api_key_env: "SRE_AGENT_CONTROLLER_API_KEY"
{{- end }}
{{- if .Values.controller.auth.readAPIKeySecretName }}
      read_api_key_env: "SRE_AGENT_CONTROLLER_READ_API_KEY"
{{- end }}
{{- if .Values.controller.auth.actionAPIKeySecretName }}
      action_api_key_env: "SRE_AGENT_CONTROLLER_ACTION_API_KEY"
{{- end }}
    web:
      path: "/var/lib/ai-sre-agent/controller/web"
    inventory:
      enabled: true
      heartbeat_ttl: "90s"
      targets_file: "/etc/ai-sre-agent/controller_targets.yaml"
    ingest:
      transport:
        allow_plaintext: {{ .Values.controller.ingestTransport.allowPlaintext }}
        tls:
          enabled: {{ .Values.controller.ingestTransport.tls.enabled }}
          require_client_cert: {{ .Values.controller.ingestTransport.tls.requireClientCert }}
          ca_file: {{ ternary "/etc/ai-sre-agent/tls/ingest/ca/ca.crt" "" .Values.controller.ingestTransport.tls.requireClientCert | quote }}
          cert_file: {{ ternary "/etc/ai-sre-agent/tls/ingest/server/tls.crt" "" .Values.controller.ingestTransport.tls.enabled | quote }}
          key_file: {{ ternary "/etc/ai-sre-agent/tls/ingest/server/tls.key" "" .Values.controller.ingestTransport.tls.enabled | quote }}
        allowed_collector_ids: {{ toJson .Values.controller.ingestTransport.allowedCollectorIDs }}
        allowed_cluster_names: {{ toJson .Values.controller.ingestTransport.allowedClusterNames }}
        allowed_peer_subjects: {{ toJson .Values.controller.ingestTransport.allowedPeerSubjects }}
    agent:
      rag_enabled: {{ .Values.controller.env.ragEnabled | quote }}
      rag_dataset_path: {{ include "sre-agent.controllerRagDatasetPath" . | quote }}
      rag_index_path: {{ include "sre-agent.controllerRagIndexPath" . | quote }}
      rag_source_paths: {{ toJson .Values.controller.rag.sourcePaths }}
      rag_top_k: {{ .Values.controller.rag.topK }}
      rag_max_snippets: {{ .Values.controller.rag.maxSnippets }}
      rag_max_chars: {{ .Values.controller.rag.maxChars }}
      rag_max_query_chars: {{ .Values.controller.rag.maxQueryChars }}
      rag_max_findings: {{ .Values.controller.rag.maxFindings }}
      rag_min_confidence: {{ .Values.controller.rag.minConfidence }}
      rag_chunk_size: {{ .Values.controller.rag.chunkSize }}
      rag_chunk_overlap: {{ .Values.controller.rag.chunkOverlap }}
      rag_chunk_strategy: {{ .Values.controller.rag.chunkStrategy | quote }}
      rag_retrieval_mode: {{ .Values.controller.rag.retrievalMode | quote }}
      rag_embedding_provider: {{ .Values.controller.rag.embeddingProvider | quote }}
      rag_embedding_model: {{ .Values.controller.rag.embeddingModel | quote }}
      rag_embedding_base_url: {{ .Values.controller.rag.embeddingBaseURL | quote }}
      rag_vector_backend: {{ .Values.controller.rag.vectorBackend | quote }}
      rag_vector_endpoint: {{ .Values.controller.rag.vectorEndpoint | quote }}
      rag_vector_collection: {{ .Values.controller.rag.vectorCollection | quote }}
      rag_vector_database: {{ .Values.controller.rag.vectorDatabase | quote }}
      rag_vector_timeout: {{ .Values.controller.rag.vectorTimeout | quote }}
      rag_rebuild_policy: {{ .Values.controller.env.ragRebuildPolicy | quote }}
      policy_file: {{ printf "%s/controller/configs/agent_playbooks.yaml" (include "sre-agent.controllerDataRoot" .) | quote }}
{{- with .Values.controller.configInline }}
{{ . | nindent 4 }}
{{- end }}
  controller_targets.yaml: |
{{- if .Values.controller.staticTargets }}
{{ toYaml .Values.controller.staticTargets | nindent 4 }}
{{- else }}
    []
{{- end }}
{{- end }}
