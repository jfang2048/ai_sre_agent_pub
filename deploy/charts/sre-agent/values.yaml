# SRE Agent values for Helm chart

# Default values for sre-agent
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: true
  name: sre-agent
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest

# Image configuration
image:
  repository: sre-agent
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

  # Optional image pull secrets
  pullSecrets: []
  # - name: my-registry-secret

# ServiceAccount configuration
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Agent configuration
config:
  logLevel: info
  logFormat: json
  env: prod

  # Server settings
  server:
    host: "0.0.0.0"
    port: 8080
    metricsPort: 9090
    enablePprof: false

  # Monitoring settings
  monitoring:
    proc:
      enabled: true
      scanInterval: 15s
    kubernetes:
      enabled: true
      inCluster: true
      resources:
        - pods
        - nodes
        - deployments
        - statefulsets
        - daemonsets
      scrapeInterval: 30s
    correlation:
      enabled: true
      timeWindow: 5m
      maxEvents: 1000

  # eBPF sidecar feed (collector)
  ebpf:
    enabled: false
    socketPath: "/var/run/sre_collector_ebpf.sock"
    categories:
      - sched
      - io
      - net
      - mem
      - gpu
      - security
      - syscall
    maxMsgBytes: 65536

  # SLO settings
  slo:
    evaluationInterval: 1m
    historyDays: 30

  # Alerting settings
  alerting:
    enabled: true
    evaluationInterval: 30s
    suppressionDuration: 15m
    defaultSeverity: "warning"
    maxAlertsPerHour: 10

    # Notification channels
    notifiers:
      webhook:
        enabled: false
        url: ""
        headers: {}
      slack:
        enabled: false
        webhookUrl: ""
      pagerduty:
        enabled: false
        routingKey: ""

  # Remediation settings
  remediation:
    enabled: false
    preventive:
      enabled: false
      triggerThreshold: 20
    reactive:
      enabled: true
      maxRetries: 3

  # Brain/LLM configuration
  brain:
    llm:
      provider: "glm"
      model: "glm-4"
      maxTokens: 1024
      temperature: 0.7

# Security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - BPF
      - NET_ADMIN
      - PERFMON
      - SYS_ADMIN
    drop:
      - ALL

# Pod security context
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Resource limits
resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# Tolerations (allow running on all nodes by default)
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - operator: Exists

# Node selector (allow running on any node)
nodeSelector: {}

# Affinity rules
affinity: {}

# RBAC settings
rbac:
  create: true
  # ClusterRole rules
  clusterRules:
    # Node access
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    # Pod access
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch", "delete", "eviction"]
    # Workload access
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch", "update", "patch"]

# Service settings
service:
  type: ClusterIP
  metricsPort: 9090
  httpPort: 8080
  annotations: {}

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  metricRelabelings: []
  additionalLabels: {}

# NetworkPolicy
networkPolicy:
  enabled: true
  ingressNamespaces:
    - monitoring
    - sre-agent

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 80%

# Volume mounts
volumes:
  - name: sys-fs-bpf
    hostPath:
      path: /sys/fs/bpf
  - name: proc
    hostPath:
      path: /proc
  - name: sys
    hostPath:
      path: /sys

volumeMounts:
  - name: sys-fs-bpf
    mountPath: /sys/fs/bpf
    readOnly: true
  - name: proc
    mountPath: /host/proc
    readOnly: true
  - name: sys
    mountPath: /host/sys
    readOnly: true

# Init containers
initContainers:
  - name: setup-bpf
    image: alpine:3.19
    command: ["/bin/sh", "-c"]
    args:
      - |
        if ! mount | grep -q "/sys/fs/bpf"; then
          mount -t bpf bpf /sys/fs/bpf || true
        fi
        if ! mount | grep -q "/sys/kernel/debug"; then
          mount -t debugfs none /sys/kernel/debug || true
        fi
    securityContext:
      privileged: true

# Liveness probe
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Priority class name
priorityClassName: ""

# annotations
podAnnotations: {}

# labels
podLabels: {}

# Replicas (for Deployment, not DaemonSet)
replicas: 1

# Use DaemonSet instead of Deployment
daemonSet: true

# HPA settings (only for Deployment)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Secret configuration
secrets:
  create: false
  # api_key: ""
  # webhook_url: ""
  # slack_webhook_url: ""
  # pagerduty_routing_key: ""
