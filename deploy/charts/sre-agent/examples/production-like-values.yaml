global:
  deploymentMode: distributed
  clusterName: prod-eu1
  dataRoot: /var/lib/ai-sre-agent

controller:
  replicas: 3
  externalURL: https://ai-sre-agent.example.com
  deployment:
    insecureOverride: false
  api:
    allowedOrigins:
      - https://ai-sre-agent.example.com
  auth:
    enabled: true
    mode: token
    tokenSecretName: sre-controller-auth
    tokenSecretKey: token-secret
    ingestAuthEnabled: true
    allowInsecureDisable: false
  workflowStore:
    backend: postgres
    postgres:
      dsnSecretName: sre-controller-workflow-postgres
      dsnSecretKey: dsn
  artifacts:
    metadataBackend: workflow
    payloadBackend: s3
    payloadShared: true
    s3:
      endpoint: minio.monitoring.svc.cluster.local:9000
      region: us-east-1
      bucket: ai-sre-agent-artifacts
      prefix: prod-eu1/controller
      pathStyle: true
      accessKeySecretName: sre-controller-artifact-s3
      secretKeySecretName: sre-controller-artifact-s3
  ingestTransport:
    allowPlaintext: false
    tls:
      enabled: true
      requireClientCert: true
      certSecretName: sre-controller-ingest-tls
      caSecretName: sre-ingest-ca
    allowedClusterNames:
      - prod-eu1
  dataVolume:
    type: pvc
    size: 50Gi
    accessModes: ["ReadWriteOnce"]
  ha:
    enabled: true
    backend: etcd
    etcdEndpoints:
      - http://etcd-0.etcd.sre.svc.cluster.local:2379
      - http://etcd-1.etcd.sre.svc.cluster.local:2379
      - http://etcd-2.etcd.sre.svc.cluster.local:2379
  ingress:
    enabled: true
    hosts:
      - host: ai-sre-agent.example.com
        paths:
          - path: /
            pathType: Prefix
  env:
    dryRun: "1"
  rag:
    vectorBackend: local
    datasetPath: /var/lib/ai-sre-agent/controller/dataset
    indexPath: /var/lib/ai-sre-agent/controller/data/agent/rag/index.json

collector:
  deploymentMode: distributed
  collectionInterval: 10s
  privilegeProfile: deep-runtime
  transportAuth:
    enabled: true
    tokenSecretName: sre-collector-ingest-auth
    tokenSecretKey: token
  transport:
    allowPlaintext: false
    tls:
      enabled: true
      caSecretName: sre-ingest-ca
      certSecretName: sre-collector-ingest-tls
