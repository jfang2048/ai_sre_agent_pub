apiVersion: v1
kind: Secret
metadata:
  name: sre-collector-ingest-auth
  namespace: sre-agent
type: Opaque
stringData:
  # Mint this with:
  # sre-controller mint-token \
  #   --secret-env SRE_AGENT_CONTROLLER_TOKEN_SECRET \
  #   --subject collector-daemonset \
  #   --actor-type service \
  #   --roles collector \
  #   --audience controller-ingest \
  #   --collector-id '*'
  #
  # This wildcard token is a bootstrap path for the raw DaemonSet. It proves
  # the caller is an authorized collector service, but it does not give each
  # node a unique transport identity.
  token: "replace-with-minted-collector-token"
