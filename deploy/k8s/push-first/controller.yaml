apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-controller
  namespace: sre-agent
---
apiVersion: v1
kind: Service
metadata:
  name: sre-controller
  namespace: sre-agent
  labels:
    app.kubernetes.io/name: sre-controller
    app.kubernetes.io/part-of: ai-sre-agent
spec:
  selector:
    app.kubernetes.io/name: sre-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: sre-controller-peer
  namespace: sre-agent
  labels:
    app.kubernetes.io/name: sre-controller
    app.kubernetes.io/part-of: ai-sre-agent
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: sre-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sre-controller
  namespace: sre-agent
  labels:
    app.kubernetes.io/name: sre-controller
    app.kubernetes.io/part-of: ai-sre-agent
spec:
  serviceName: sre-controller-peer
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-controller
        app.kubernetes.io/part-of: ai-sre-agent
    spec:
      serviceAccountName: sre-controller
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ai-sre-agent/controller:v0.6
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SRE_CONTROLLER_CONFIG
              value: /etc/ai-sre-agent/controller.yaml
            - name: SRE_CONTROLLER_HTTP_LISTEN
              value: 0.0.0.0:8080
            - name: SRE_CONTROLLER_GRPC_LISTEN
              value: 0.0.0.0:9090
            - name: SRE_CONTROLLER_WEB_PATH
              value: /var/lib/ai-sre-agent/controller/web
            - name: SRE_CONTROLLER_HA_ENABLED
              value: "1"
            - name: SRE_CONTROLLER_HA_BACKEND
              value: etcd
            - name: SRE_CONTROLLER_HA_NODE_ID
              value: $(POD_NAME)
            - name: SRE_CONTROLLER_HA_ADVERTISE_HTTP
              value: http://$(POD_NAME).sre-controller-peer.sre-agent.svc.cluster.local:8080
            - name: SRE_CONTROLLER_HA_ADVERTISE_GRPC
              value: $(POD_NAME).sre-controller-peer.sre-agent.svc.cluster.local:9090
            - name: SRE_CONTROLLER_HA_ELECTION_KEY
              value: /ai-sre-agent/controller/leader
            - name: SRE_CONTROLLER_HA_LEASE_TTL
              value: 15s
            - name: SRE_CONTROLLER_HA_OBSERVE_INTERVAL
              value: 3s
            - name: SRE_CONTROLLER_HA_CAMPAIGN_TIMEOUT
              value: 5s
            - name: SRE_CONTROLLER_HA_ALLOW_FOLLOWER_READ
              value: "1"
            - name: SRE_CONTROLLER_HA_ETCD_ENDPOINTS
              value: http://etcd-0.etcd.sre-agent.svc.cluster.local:2379,http://etcd-1.etcd.sre-agent.svc.cluster.local:2379,http://etcd-2.etcd.sre-agent.svc.cluster.local:2379
            - name: SRE_INGEST_PERSIST_ENABLED
              value: "1"
            - name: SRE_AGENT_RAG_ENABLED
              value: "1"
            - name: SRE_AGENT_RAG_REBUILD_POLICY
              value: if_missing
            - name: SRE_AGENT_LLM_ENABLED
              value: "0"
            - name: SRE_AGENT_DRY_RUN
              value: "1"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: controller-data
              mountPath: /var/lib/ai-sre-agent/controller/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: controller-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
