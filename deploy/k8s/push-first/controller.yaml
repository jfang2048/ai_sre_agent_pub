apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-controller-config
  namespace: sre-agent
data:
  controller.yaml: |
    listen: ":8080"
    grpc_listen: ":9090"
    log_level: "info"
    analysis:
      enabled: true
      interval: "30s"
      threshold_alerts: true
      anomaly_detection: true
      correlation_analysis: true
      llm_enabled: false
    agent:
      enabled: true
      interval: "30s"
      persist_dir: "./data/agent"
      llm_enabled: false
    gpu:
      enabled: true
      persist_dir: "./data/gpu"
      flush_interval: "10s"
      retention: "168h"
      max_processes_per_gpu: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-controller
  namespace: sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-controller
  template:
    metadata:
      labels:
        app: sre-controller
    spec:
      containers:
        - name: controller
          image: sre-agent/sre-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/sre-controller/controller.yaml"
            - "--web-path=/var/lib/sre-controller/web"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          workingDir: /var/lib/sre-controller
          volumeMounts:
            - name: config
              mountPath: /etc/sre-controller
              readOnly: true
            - name: data
              mountPath: /var/lib/sre-controller/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: sre-controller-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-controller
  namespace: sre-agent
spec:
  selector:
    app: sre-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
