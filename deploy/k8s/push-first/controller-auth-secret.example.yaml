apiVersion: v1
kind: Secret
metadata:
  name: sre-controller-auth
  namespace: sre-agent
type: Opaque
stringData:
  # HMAC signing secret for controller-issued bearer tokens. Generate a long,
  # random value. The controller uses it to verify HTTP and ingest tokens.
  token-secret: "replace-with-random-signing-secret"
  # Compatibility mode only. Leave these out unless you still need API-key callers.
  api-key: ""
  read-api-key: ""
  action-api-key: ""
