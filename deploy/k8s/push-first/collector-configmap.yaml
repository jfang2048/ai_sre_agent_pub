apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-collector-config
  namespace: sre-agent
  labels:
    app.kubernetes.io/name: sre-collector
    app.kubernetes.io/part-of: ai-sre-agent
data:
  collector.yaml: |
    deployment:
      mode: "cluster-lite"
      cluster_name: "example-cluster"
      data_root: "/var/lib/ai-sre-agent"
    privilege_profile: "deep-runtime"
    transport:
      allow_plaintext: true
      auth:
        enabled: true
        bearer_token_env: "SRE_COLLECTOR_INGEST_TOKEN"
      tls:
        enabled: false
        ca_file: ""
        cert_file: ""
        key_file: ""
        server_name: ""
    probe_core:
      binary_path: "/usr/local/bin/sre-probe-core"
