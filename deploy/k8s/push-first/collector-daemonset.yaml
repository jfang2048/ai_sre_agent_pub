apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-collector
  namespace: sre-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sre-collector
  namespace: sre-agent
spec:
  selector:
    matchLabels:
      app: sre-collector
  template:
    metadata:
      labels:
        app: sre-collector
    spec:
      serviceAccountName: sre-collector
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          image: sre-agent/sre-collector:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--level"
            - "2"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SRE_COLLECTOR_HOSTNAME
              value: "$(NODE_NAME)"
            - name: SRE_COLLECTOR_ID
              value: "$(NODE_NAME)"
            - name: SRE_COLLECTOR_CONTROLLER_ENDPOINTS
              value: "sre-controller.sre-agent.svc.cluster.local:9090"
            - name: SRE_COLLECTOR_LOG_PATHS
              value: "/var/log/syslog,/var/log/messages"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "utility,compute"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: host-sys
              mountPath: /sys
              readOnly: true
            - name: host-logs
              mountPath: /var/log
              readOnly: true
            - name: spool
              mountPath: /tmp/sre-collector-spool
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-logs
          hostPath:
            path: /var/log
            type: DirectoryOrCreate
        - name: spool
          emptyDir: {}
