syntax = "proto3";

package telemetry.v1;

option go_package = "github.com/jfang2048/ai_sre_agent_pub/pkg/telemetry/v1;telemetryv1";

message Label {
  string key = 1;
  string value = 2;
}

message CollectorInfo {
  string collector_id = 1;
  string hostname = 2;
  string version = 3;
  string os = 4;
  string arch = 5;
  repeated Label labels = 6;
}

message Metric {
  string name = 1;
  double value = 2;
  int64 timestamp_unix_nano = 3;
  repeated Label labels = 4;
}

message ProcessSample {
  int32 pid = 1;
  string name = 2;
  double cpu_percent = 3;
  uint64 rss_bytes = 4;
  double io_read_bps = 5;
  double io_write_bps = 6;
}

message LogFingerprint {
  string fingerprint = 1;
  uint64 count = 2;
  string example = 3;
  int64 timestamp_unix_nano = 4;
}

message TelemetryBatch {
  CollectorInfo collector = 1;
  int64 wall_time_unix_nano = 2;
  int64 monotonic_time_unix_nano = 3;
  repeated Metric metrics = 4;
  repeated ProcessSample processes = 5;
  repeated LogFingerprint logs = 6;
  string batch_id = 7;
}

message Ack {
  string batch_id = 1;
}

service TelemetryIngest {
  rpc Push(stream TelemetryBatch) returns (stream Ack);
}
