name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tests/integration/go.sum
            tests/e2e/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/setup.py

      - name: Install frontend dependencies
        run: npm -C frontend ci

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python

      - name: Run CI checks
        run: bash scripts/ci.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit yamllint
          wget -qO /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.21.2_linux_x64.tar.gz \
            && tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            && chmod +x /usr/local/bin/hadolint

      - name: Run security scans
        env:
          SECURITY_SCAN_STRICT: "1"
          SECURITY_AUDIT_FAIL_ON: "fail"
          GO_CACHE: ${{ github.workspace }}/.gocache
        run: bash scripts/security-scan.sh

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: build/security
          if-no-files-found: ignore
