name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - 'v*'

jobs:
  test-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            backend/go.sum
            tests/integration/go.sum
            tests/e2e/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/setup.py

      - name: Install frontend dependencies
        run: npm -C frontend ci

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python

      - name: Run CI checks
        run: bash scripts/ci.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit yamllint
          gitleaks_version=8.30.1
          gitleaks_archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          wget -qO "/tmp/${gitleaks_archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_archive}"
          wget -qO /tmp/gitleaks_checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_checksums.txt"
          (cd /tmp && grep " ${gitleaks_archive}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${gitleaks_archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      - name: Run security scans
        env:
          SECURITY_SCAN_STRICT: "1"
          SECURITY_AUDIT_FAIL_ON: "fail"
          GO_CACHE: ${{ github.workspace }}/.gocache
        run: bash scripts/security-scan.sh

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: build/security
          if-no-files-found: ignore
